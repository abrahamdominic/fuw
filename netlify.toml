[build]
  command = "npm run build"
  publish = "dist"

# ----------------------------------------------------------------------------
# Redirects
#
# This file owns the *policy* redirects (legacy aliases, hard blocks, headers).
# The per-route SPA rewrites are generated into dist/_redirects by
# scripts/generate-seo.ts, from the same source of truth as sitemap.xml, so a
# URL is indexable and resolvable or it is neither.
#
# Do not add a `/*` catch-all here. A `/* -> /404.html  404` rule with
# `force = true` wins over the file server, which means it also hijacks
# robots.txt, sitemap.xml, favicon.ico and every hashed asset — the site ends
# up serving HTML in place of its own CSS and JS. A `/* -> /index.html  200`
# rule has the opposite problem: it answers HTTP 200 for pages that do not
# exist, which seo.md §31 and §54 forbid.
#
# With no catch-all, Netlify serves real files first and answers everything
# unmatched with dist/404.html and a genuine HTTP 404.
# ----------------------------------------------------------------------------

# Legacy alias: /departments was a duplicate of /faculties. One permanent
# redirect, no chain, no second copy of the same directory page.
[[redirects]]
  from = "/departments"
  to = "/faculties"
  status = 301
  force = true

# Historic .html URLs that may still be linked from outside.
[[redirects]]
  from = "/library.html"
  to = "/library"
  status = 301
  force = true

[[redirects]]
  from = "/faculties.html"
  to = "/faculties"
  status = 301
  force = true

[[redirects]]
  from = "/courses.html"
  to = "/courses"
  status = 301
  force = true

[[redirects]]
  from = "/repository.html"
  to = "/repository"
  status = 301
  force = true

[[redirects]]
  from = "/collections.html"
  to = "/collections"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/help.html"
  to = "/help"
  status = 301
  force = true

# Block access to any potential sensitive file extensions or patterns
[[redirects]]
  from = "/*.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.bak"
  to = "/404.html"
  status = 404
  force = true

# No SPA catch-all: see the header comment. dist/_redirects lists every route
# that exists with a 200 rewrite, and Netlify answers the rest with
# dist/404.html at HTTP 404.

# ----------------------------------------------------------------------------
# Headers
# ----------------------------------------------------------------------------

# Security headers for robots.txt
[[headers]]
  for = "/robots.txt"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=43200"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The generated 404 shell must never be cached as a successful document.
[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers (CFG-01). Served with every response.
# CSP: SPA assets from 'self'; Google Fonts; Supabase API/Realtime/storage.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:"